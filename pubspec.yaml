name: pocketbible
description: "PocketBible - Malayalam Holy Bible (സത്യവേദപുസ്തകം 1910). Fast, offline, responsive Bible reader with search, bookmarks, highlights and study tools."
publish_to: 'none'
version: 1.5.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Local Persistence & Database
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # UI & Styling
  google_fonts: ^6.2.1

  # Native Device Features
  share_plus: ^9.0.0
  wakelock_plus: ^1.2.5
  url_launcher: ^6.2.6
  flutter_local_notifications: ^18.0.1
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true

  assets:
    - assets/database/
    - assets/data/
    - assets/fonts/
    - assets/icons/
    - assets/icons/pocketbible-icon.webp
    - assets/icons/pocketbible-icon-touch.png
    - assets/icons/app_icon.png
    - assets/icons/pocketbible_full_logo.png
    - assets/icons/pocketbible_full_logo_dark.png

  fonts:
    - family: Noto Sans Malayalam
      fonts:
        - asset: assets/fonts/NotoSansMalayalam-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansMalayalam-Bold.ttf
          weight: 700
